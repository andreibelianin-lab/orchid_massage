<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 1400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="petalCenter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <path d="M 60 1400 C 40 1100, 90 900, 55 700 C 30 500, 80 300, 60 80"
        fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>

  <ellipse cx="45" cy="1200" rx="45" ry="18" fill="url(#leafGrad)" transform="rotate(-25 45 1200)"/>
  <ellipse cx="80" cy="1000" rx="50" ry="20" fill="url(#leafGrad)" transform="rotate(20 80 1000)"/>
  <ellipse cx="40" cy="820" rx="48" ry="19" fill="url(#leafGrad)" transform="rotate(-30 40 820)"/>
  <ellipse cx="85" cy="620" rx="52" ry="21" fill="url(#leafGrad)" transform="rotate(25 85 620)"/>
  <ellipse cx="45" cy="420" rx="48" ry="19" fill="url(#leafGrad)" transform="rotate(-28 45 420)"/>

  <g transform="translate(60 80)">
    <ellipse cx="0" cy="-32" rx="20" ry="34" fill="url(#petalGrad)" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="20" ry="34" fill="url(#petalGrad)" opacity="0.9" transform="rotate(72 0 0)"/>
    <ellipse cx="0" cy="0" rx="20" ry="34" fill="url(#petalGrad)" opacity="0.9" transform="rotate(144 0 0)"/>
    <ellipse cx="0" cy="0" rx="20" ry="34" fill="url(#petalGrad)" opacity="0.9" transform="rotate(216 0 0)"/>
    <ellipse cx="0" cy="0" rx="20" ry="34" fill="url(#petalGrad)" opacity="0.9" transform="rotate(288 0 0)"/>
    <circle cx="0" cy="0" r="12" fill="url(#petalCenter)"/>
    <circle cx="0" cy="0" r="5" fill="#7C3AED" opacity="0.6"/>
  </g>
</svg>